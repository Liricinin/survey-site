<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Опрос</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            background: #1c1c1c;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        h2 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border-radius: 12px;
            background: #2a2a2a;
            cursor: pointer;
            transition: background 0.2s;
        }

        label:hover {
            background: #333333;
        }

        input[type="radio"] {
            transform: scale(1.4);
            margin-right: 12px;
        }

        input[type="radio"]:checked {
            accent-color: #4CAF50;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: none;
            border-radius: 14px;
            background: #4CAF50;
            color: #000000;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.97);
        }

        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Считаете ли вы изучение литературы с интеграцией в неё театрыльных элементов более эффективным?</h2>

    <form method="post">
        <label>
            <input type="radio" name="genre" value="Да" required>
            Да
        </label>

        <label>
            <input type="radio" name="genre" value="Нет">
            Нет
        </label>

        <label>
            <input type="radio" name="genre" value="Не читаю">
            Не читаю
        </label>

        <button type="submit">Отправить</button>
    </form>
</div>

</body>
</html>
