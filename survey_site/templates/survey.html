<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Опрос</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 30px 35px;
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            margin-bottom: 25px;
        }

        .option {
            display: block;
            padding: 12px 15px;
            margin-bottom: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #667eea;
            background: #f4f6ff;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #5a6be0;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Какой жанр литературы вам больше нравится?</h2>
    <form method="post">
        <label class="option">
            <input type="radio" name="genre" value="Древнерусская" required>
            Древнерусская литература
        </label>

        <label class="option">
            <input type="radio" name="genre" value="Современная">
            Современная литература
        </label>

        <label class="option">
            <input type="radio" name="genre" value="Другое">
            Другое
        </label>

        <label class="option">
            <input type="radio" name="genre" value="Не читаю">
            Не читаю
        </label>

        <button type="submit">Отправить</button>
    </form>
</div>

</body>
</html>
