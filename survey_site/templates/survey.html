<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Опрос</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: #f3f3f3;
            cursor: pointer;
            font-size: 18px;
        }

        input {
            display: none;
        }

        input:checked + span {
            font-weight: bold;
            color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #667eea;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Выбери вариант</h1>

    <form method="post">
        <label>
            <input type="radio" name="genre" value="Древнерусская" required>
            <span>Древнерусская</span>
        </label>

        <label>
            <input type="radio" name="genre" value="Современная">
            <span>Современная</span>
        </label>

        <label>
            <input type="radio" name="genre" value="Другое">
            <span>Другое</span>
        </label>

        <button type="submit">Отправить</button>
    </form>
</div>

</body>
</html>
